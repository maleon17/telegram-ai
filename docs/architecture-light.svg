<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Telegram AI architecture</title>
  <style>
    .band   { fill: #e0f2fe; stroke: #7dd3fc; }
    .box    { fill: #eef2ff; stroke: #6366f1; }
    .user   { fill: #ecfdf5; stroke: #10b981; }
    .core   { fill: #fef3c7; stroke: #d97706; }
    .agent  { fill: #f5f3ff; stroke: #8b5cf6; }
    .t      { fill: #1f2937; font-size: 15px; }
    .tb     { fill: #1f2937; font-size: 15px; font-weight: 600; }
    .cap    { fill: #0369a1; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
    .lbl    { fill: #4b5563; font-size: 12.5px; }
    .pill   { fill: #ffffff; }
    .line   { stroke: #374151; stroke-width: 1.6; fill: none; }
    .dash   { stroke: #6b7280; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .ah     { fill: #374151; }
    .ahd    { fill: #6b7280; }
    </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahd" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Telegram -->
  <rect class="band" x="20" y="16" width="920" height="112" rx="14"/>
  <text class="cap" x="38" y="38">TELEGRAM</text>
  <rect class="box" x="60" y="52" width="220" height="56" rx="9"/>
  <text class="t" x="170" y="85" text-anchor="middle">Claude bot chat</text>
  <rect class="box" x="370" y="52" width="220" height="56" rx="9"/>
  <text class="t" x="480" y="76" text-anchor="middle">Any of your chats</text>
  <text class="t" x="480" y="96" text-anchor="middle">.ask / .xask</text>
  <rect class="box" x="680" y="52" width="220" height="56" rx="9"/>
  <text class="t" x="790" y="85" text-anchor="middle">Codex bot chat</text>

  <!-- Bridges -->
  <rect class="box" x="60" y="176" width="220" height="56" rx="9"/>
  <text class="tb" x="170" y="209" text-anchor="middle">Claude Telegram Bridge</text>
  <rect class="box" x="680" y="176" width="220" height="56" rx="9"/>
  <text class="tb" x="790" y="209" text-anchor="middle">Codex Telegram Bridge</text>

  <!-- Userbot -->
  <rect class="user" x="370" y="262" width="220" height="56" rx="9"/>
  <text class="tb" x="480" y="286" text-anchor="middle">Your userbot</text>
  <text class="t" x="480" y="306" text-anchor="middle">ClaudeAsk · CodexAsk</text>

  <!-- Core -->
  <rect class="core" x="330" y="374" width="300" height="64" rx="9"/>
  <text class="tb" x="480" y="400" text-anchor="middle">telegram-ai-core</text>
  <text class="t" x="480" y="422" text-anchor="middle">queue relay · Telegram actions MCP</text>

  <!-- Agents -->
  <rect class="agent" x="60" y="508" width="220" height="56" rx="9"/>
  <text class="tb" x="170" y="541" text-anchor="middle">Claude Code</text>
  <rect class="agent" x="680" y="508" width="220" height="56" rx="9"/>
  <text class="tb" x="790" y="541" text-anchor="middle">Codex App Server</text>

  <!-- Telegram <-> front ends -->
  <line class="line" x1="170" y1="110" x2="170" y2="174" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="790" y1="110" x2="790" y2="174" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="480" y1="110" x2="480" y2="260" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Bridge <-> bridge delegation -->
  <line class="dash" x1="282" y1="204" x2="472" y2="204" marker-start="url(#d)"/>
  <line class="dash" x1="488" y1="204" x2="678" y2="204" marker-end="url(#d)"/>
  <rect class="pill" x="335" y="193" width="80" height="22" rx="11"/>
  <text class="lbl" x="375" y="208" text-anchor="middle">delegate</text>

  <!-- Bridges <-> their agents -->
  <line class="line" x1="120" y1="234" x2="120" y2="506" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="840" y1="234" x2="840" y2="506" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Userbot <-> core -->
  <line class="line" x1="480" y1="320" x2="480" y2="372" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Bridges <-> core: Telegram actions, delegate_to_bridge -->
  <path class="dash" d="M230,234 C230,330 280,392 328,400" marker-start="url(#d)" marker-end="url(#d)"/>
  <path class="dash" d="M730,234 C730,330 680,392 632,400" marker-start="url(#d)" marker-end="url(#d)"/>
  <rect class="pill" x="168" y="296" width="140" height="22" rx="11"/>
  <text class="lbl" x="238" y="311" text-anchor="middle">actions · delegation</text>
  <rect class="pill" x="652" y="296" width="140" height="22" rx="11"/>
  <text class="lbl" x="722" y="311" text-anchor="middle">actions · delegation</text>

  <!-- Core <-> agents through the workers -->
  <path class="line" d="M400,440 C400,500 340,536 282,536" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M560,440 C560,500 620,536 678,536" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="pill" x="296" y="478" width="104" height="22" rx="11"/>
  <text class="lbl" x="348" y="493" text-anchor="middle">Claude worker</text>
  <rect class="pill" x="560" y="478" width="104" height="22" rx="11"/>
  <text class="lbl" x="612" y="493" text-anchor="middle">Codex worker</text>
</svg>
